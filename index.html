<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141614"><title>星光雕刻工坊 · 写实工作室</title><link rel="stylesheet" href="./styles.css?v=portrait-score1">
<script type="importmap">{"imports":{"./cell-inventory.js":"./cell-inventory.js?v=belt-scores1","./coin-material.js":"./coin-material.js?v=realism3","./tray-exchange.js":"./tray-exchange.js?v=realism1","./art.js":"./art.js?v=portrait-score1","./photo-scene.js":"./photo-scene.js?v=realism2","./scan-path.js":"./scan-path.js?v=realism1","./live-camera.js":"./live-camera.js?v=portrait-score1","./handling-cycle.js":"./handling-cycle.js?v=portrait-score1","./showcase-view.js":"./showcase-view.js?v=portrait-score1","./portrait-score.js":"./portrait-score.js?v=portrait-score1","./score-overlay.js":"./score-overlay.js?v=portrait-score1","./production-speed.js":"./production-speed.js?v=portrait-score1"}}</script></head>
<body><script>if(new URLSearchParams(location.search).has("live"))document.body.classList.add("live-mode");</script><div class="app-shell"><main class="stream" aria-label="1080乘1920写实激光雕刻工作室"><div id="scene" class="scene-viewport"></div></main><button id="openControls" class="studio-control" aria-label="打开工坊控制台" aria-expanded="false" aria-controls="studioPanel" title="控制台">⚙</button><button id="closeBackdrop" class="drawer-backdrop" aria-label="关闭控制台" tabindex="-1"></button>      <aside id="studioPanel" class="sim-panel" hidden aria-label="模拟直播控制台">
        <div class="panel-heading">
          <span class="panel-icon">✦</span>
          <div>
            <h2>工坊控制台</h2>
            <p>STUDIO CONTROL / LOCAL DEMO</p>
          </div>
          <span class="version">V0.2</span>
        </div>
        <div class="mock-warning">
          <span>i</span>
          当前仅使用本地虚拟头像与礼物事件；尚未连接抖音官方直播接口。
        </div>
        <label class="field-title" for="nickname">模拟观众昵称</label>
        <div class="name-control">
          <input
            id="nickname"
            type="text"
            maxlength="12"
            placeholder="输入昵称，不填则随机生成"
          /><button id="randomName" title="随机昵称">↻</button>
        </div>
        <div class="field-title">模拟直播互动</div>
        <div class="event-grid">
          <button class="event-button" data-event="comment">
            <span class="event-emoji icon-comment"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20 11.5a8 8 0 0 1-8 8 8.6 8.6 0 0 1-3.7-.8L4 20l1.3-4.2A8 8 0 1 1 20 11.5Z"
                />
                <path d="M8.5 11.5h7" /></svg></span
            ><strong>评论入场</strong><small>星光 +10</small>
          </button>
          <button class="event-button" data-event="like">
            <span class="event-emoji icon-like"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.8 4.8a5.1 5.1 0 0 0-7.2 0L12 6.4l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2L12 21l8.8-9a5.1 5.1 0 0 0 0-7.2Z"
                /></svg></span
            ><strong>点亮小心心</strong><small>星光 +5</small>
          </button>
          <button class="event-button" data-event="rose">
            <span class="event-emoji icon-rose"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M11 14c-3 .6-6-2-5-5-2-3 1-5 3-5 1-3 5-2 6-1 3-1 5 2 4 4 2 2 0 5-2 5-1 2-4 3-6 2Z"
                />
                <path
                  d="M11 14c2-4 6-5 6-7M12 14c0 3 1 5 0 8m0-4-4-2m4 3 5-3"
                /></svg></span
            ><strong>送出玫瑰</strong><small>星光 +30</small>
          </button>
          <button class="event-button event-golden" data-event="crown">
            <span class="event-emoji icon-crown"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 8 7.3 12 12 4l4.7 8L21 8l-2 11H5L3 8Z" />
                <path d="M6 22h12" /></svg></span
            ><strong>送出皇冠</strong><small>星光 +100</small>
          </button>
        </div>
        <div class="line"></div>
        <div class="field-title">压力与节奏测试</div>
        <label class="field-title" for="productionSpeed">加工速度</label>
        <div class="name-control">
          <select id="productionSpeed" class="outline-button" aria-describedby="cycleDuration">
            <option value="1">1× · 从容展示</option>
            <option value="1.5">1.5× · 加快</option>
            <option value="1.8" selected>1.8× · 直播推荐</option>
            <option value="2">2× · 快速</option>
            <option value="2.5">2.5× · 高速</option>
          </select>
        </div>
        <p id="cycleDuration" class="panel-bottom" aria-live="polite">完整加工时长随速度调整</p>
        <div class="test-row">
          <button id="batch10" class="outline-button">+ 10 位观众</button
          ><button id="batch30" class="outline-button">+ 30 位观众</button>
        </div>
        <label class="auto-switch"
          ><div>
            <strong>自动模拟新观众</strong><small id="autoInterval">跟随加工速度补充，最多保留 2 位等待</small>
          </div>
          <input type="checkbox" id="autoSwitch" /><span class="switch"></span
        ></label>
        <div class="metrics">
          <div><span>等待中</span><strong id="panelQueue">0</strong></div>
          <div><span>已完成</span><strong id="panelDone">0</strong></div>
          <div><span>本场累计</span><strong id="panelTotal">0</strong></div>
        </div>
        <div class="field-title">收料盘 <span id="collectorCount">0 / 24</span></div>
        <button id="clearCollector" class="outline-button">更换收料盘</button>
        <div class="toolbar">
          <button id="pauseButton" class="primary-button">Ⅱ 暂停</button
          ><button id="resetButton" class="danger-button">↺ 重置演示</button>
        </div>
        <div class="field-title logs-title">
          实时事件日志 <span id="clock">00:00:00</span>
        </div>
        <div
          id="eventLog"
          class="event-log"
          role="log"
          aria-live="polite"
        ></div>
        <div class="panel-bottom">
          写实合成场景 · 本地互动模拟 · OBS 浏览器源<br />OBS
          画面地址：<code>/?live=1</code>（同浏览器标签可同步模拟事件）<br />头像与排行榜均为模拟数据
          / 不涉及真实礼物交易
        </div>
<section class="session-details"><div class="metrics"><div><span>今日雕刻</span><strong id="finishedCount">0000</strong></div><div><span>排队</span><strong id="queueCount">0</strong></div></div><div class="job-console"><div class="job-user"><img id="activeAvatar" alt="当前观众头像"><div><small>当前作品</small><strong id="activeName">等待下一位观众</strong></div></div><div class="progress-row"><span id="jobState">STANDBY · 待机</span><span id="percent">0%</span></div><div class="progress-track"><i id="progressFill"></i></div></div><div class="field-title">最近作品</div><div id="recentList" class="recent-list"></div><div class="field-title">星光荣耀榜</div><div id="leaderboard" class="leaderboard"></div><p id="tickerText" class="ticker">欢迎来到工坊</p></section>      </aside></div><script type="module" src="./main.js?v=realism1"></script></body></html>
